[pytest]
testpaths = tests app/tests
asyncio_mode = auto
# Share ONE session-scoped event loop across all async fixtures and tests. The
# test_engine fixture is session-scoped; with the default function-scoped loops
# its asyncpg connections get bound to a loop that's already closed by the next
# test, raising "another operation is in progress". SQLite tolerates this;
# PostgreSQL/asyncpg does not. Pinning both scopes to session keeps the engine's
# connections on a live loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    requires_postgres: Test requires PostgreSQL-specific features (skipped on SQLite).
    slow: Test is slow and may be skipped in quick runs.
    integration: Test requires external services.
    e2e: End-to-end tests that require Playwright and a running frontend.
