[pytest]
testpaths = tests app/tests
asyncio_mode = auto
# Tests default to function-scoped event loops (safe, isolated). Running the
# suite against PostgreSQL/asyncpg needs session-scoped loops
# (asyncio_default_{fixture,test}_loop_scope = session), but sharing one loop
# across tests surfaced flaky cross-test failures (e.g. webhooks), so it is
# intentionally NOT enabled. Re-enable + fix the isolation leaks for a PG run.
markers =
    requires_postgres: Test requires PostgreSQL-specific features (skipped on SQLite).
    slow: Test is slow and may be skipped in quick runs.
    integration: Test requires external services.
    e2e: End-to-end tests that require Playwright and a running frontend.
