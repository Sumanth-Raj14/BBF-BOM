target-version = "py311"
line-length = 100

[format]
quote-style = "double"

[lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
# SIM103 joins the existing SIM opt-outs: it fires on the last guard of a
# symmetric range check (bom_effectivity_service's serial/date bounds), where
# "return not (hi is not None and key > _serial_key(hi))" would make one bound
# read differently from the other. The parallel guard clauses are the clearer
# form there, so the rule is off rather than the code contorted to satisfy it.
ignore = ["E501", "B904", "N815", "UP045", "B008", "E402", "N803", "F403", "N802", "N806", "SIM102", "SIM103", "SIM105", "SIM115", "SIM117", "B017"]

[lint.per-file-ignores]
"tests/*" = ["SIM", "F401"]
"app/tests/*" = ["SIM", "F401"]
"**/__init__.py" = ["F401"]
"seed_*.py" = ["F401"]
"app/core/job_queue.py" = ["F401"]
"app/core/saml_sso.py" = ["F401"]
