name: Postgres CI (Fresh Install + Migration Head)

# Why this workflow exists (separate from ci.yml's test-backend job):
# ci.yml's test-backend job runs `alembic upgrade head` directly against a brand-new
# Postgres service container. That fails on a truly empty database: migrations 004+
# reference tables (po_headers and ~73 others) that only ever existed via
# Base.metadata.create_all() and weren't formalized into migrations until revision 022 —
# see backend/scripts/init_db.py's docstring. This workflow is the regression guard for
# that whole class of bug: it proves the actual documented bootstrap path
# (`python -m scripts.init_db`) brings up a schema-matching, head-stamped Postgres
# database from nothing, on every push/PR, on real Postgres (not SQLite, which silently
# tolerates things Postgres does not: enum types, JSONB, NUMERIC precision, RLS/session
# variables, asyncpg-only driver behavior, etc).

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"

jobs:
  fresh-install-postgres:
    name: Fresh Install on Postgres (init_db bootstrap)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bom_user
          POSTGRES_PASSWORD: ci_postgres_pw_9f3a7c1e
          POSTGRES_DB: bom_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_SERVER: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: bom_user
      POSTGRES_PASSWORD: ci_postgres_pw_9f3a7c1e
      POSTGRES_DB: bom_db
      DATABASE_URL: postgresql+asyncpg://bom_user:ci_postgres_pw_9f3a7c1e@127.0.0.1:5432/bom_db
      SECRET_KEY: ci-pg-track-signkey-donotuse-9f3a7c1e4b2d5a8b6d4f2a0c8e7b
      ENCRYPTION_KEY: ci-postgres-track-encryption-key-do-not-use-in-prod-4b2d9f3a
      S3_SECRET_KEY: ci-pg-track-s3key-donotuse-7c1e4b2d9f3a5a8b6d4f2a0c8e7b
      ADMIN_EMAIL: ci@blackbox-bom.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Wait for Postgres to accept connections
        run: |
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U bom_user && break
            echo "Waiting for postgres... ($i)"
            sleep 2
          done

      - name: Sanity check - app imports cleanly with these env vars
        run: python -c "import app.main; print('app.main imported OK')"

      - name: Fresh install bootstrap against EMPTY Postgres (scripts/init_db)
        run: python -m scripts.init_db

      - name: Verify alembic_version is stamped at head (050_rfq_headers_created_by_nullable)
        run: |
          python -c "
          import asyncio
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          EXPECTED_HEAD = '050_rfq_headers_created_by_nullable'

          async def main():
              engine = create_async_engine('${{ env.DATABASE_URL }}')
              async with engine.connect() as conn:
                  result = await conn.execute(text('SELECT version_num FROM alembic_version'))
                  row = result.fetchone()
                  assert row is not None, 'alembic_version table is empty after init_db bootstrap'
                  version = row[0]
                  print(f'alembic_version.version_num = {version}')
                  assert version == EXPECTED_HEAD, (
                      f'Expected head revision {EXPECTED_HEAD!r}, got {version!r}. '
                      'Update EXPECTED_HEAD in this workflow if a new head migration was added.'
                  )
              await engine.dispose()

          asyncio.run(main())
          "

      - name: Verify alembic CLI agrees the DB is at head
        run: |
          python -m alembic current
          CURRENT=$(python -m alembic current 2>/dev/null | head -n1)
          echo "alembic current: $CURRENT"
          echo "$CURRENT" | grep -q '050_rfq_headers_created_by_nullable' || (echo "::error::alembic current does not report head 050_rfq_headers_created_by_nullable" && exit 1)

      - name: Re-run init_db against an already-migrated DB (idempotency check)
        run: python -m scripts.init_db

      - name: Confirm core tables exist (spot check, real Postgres types/constraints)
        run: |
          python -c "
          import asyncio
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          TABLES = ['tenants', 'users', 'parts', 'boms', 'po_headers']

          async def main():
              engine = create_async_engine('${{ env.DATABASE_URL }}')
              async with engine.connect() as conn:
                  for t in TABLES:
                      result = await conn.execute(
                          text('SELECT to_regclass(:t)'), {'t': t}
                      )
                      exists = result.scalar()
                      assert exists is not None, f'Expected table {t!r} to exist after bootstrap'
                      print(f'table {t!r} OK')
              await engine.dispose()

          asyncio.run(main())
          "

  pytest-postgres:
    name: Test Suite on Postgres
    runs-on: ubuntu-latest
    # Runs the FULL pytest suite against real Postgres (asyncpg), so the
    # PostgreSQL-only code paths actually execute -- full-text search
    # (ts_rank / @@), INTERVAL date math, ::jsonb casts, RETURNING, NUMERIC
    # precision, tenant NOT NULL constraints -- all of which SQLite silently
    # tolerates or can't parse. This is the track where the ~14 SQLite-only
    # "dialect" failures are expected to PASS.
    #
    # HARD GATE: the full Postgres suite must pass. The former SQLite-only
    # "dialect" failures + real Postgres-exposed bugs (tenant id sequence, FK
    # enforcement, BOM explosion ordering) are fixed. The migration-system tests
    # are green too: the chain-topology / fresh-apply tests are pinned to their
    # intended target revisions, offline-SQL-gen is a documented xfail (migrations
    # use runtime inspect() for conditional DDL, incompatible with --sql mode;
    # init_db is the supported bootstrap, covered by the fresh-install-postgres
    # job), and the obsolete sql_archive test was removed. A red here blocks merge.
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bom_user
          POSTGRES_PASSWORD: ci_postgres_pw_9f3a7c1e
          POSTGRES_DB: bom_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # conftest reads TEST_DATABASE_URL first; point it at the service DB.
      # The test_engine drop_all/create_all's this DB, so it must be a throwaway
      # (bom_test_db, not a bootstrapped one).
      TEST_DATABASE_URL: postgresql+asyncpg://bom_user:ci_postgres_pw_9f3a7c1e@127.0.0.1:5432/bom_test_db
      # NB: values must NOT contain a substring in _WEAK_SECRET_VALUES (config.py) —
      # e.g. "test"/"secret"/"admin" — or Settings rejects them as weak and conftest
      # fails to import. Use "suite" (cf. the fresh-install/sqlite jobs' "track").
      SECRET_KEY: ci-pg-suite-signkey-donotuse-9f3a7c1e4b2d5a8b6d4f2a0c8e7b
      ENCRYPTION_KEY: ci-pg-suite-encryption-key-do-not-use-in-prod-4b2d9f3a5a8b
      S3_SECRET_KEY: ci-pg-suite-s3key-donotuse-7c1e4b2d9f3a5a8b6d4f2a0c8e7b
      POSTGRES_PASSWORD: ci_postgres_pw_9f3a7c1e
      ADMIN_EMAIL: ci@blackbox-bom.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Wait for Postgres to accept connections
        run: |
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U bom_user && break
            echo "Waiting for postgres... ($i)"
            sleep 2
          done

      - name: Run pytest against Postgres
        # Session-scoped asyncio loops are REQUIRED for asyncpg: the session-scoped
        # test_engine on the default function-scoped loops raises
        # "another operation is in progress". Passed via -o here (not pytest.ini)
        # so local / SQLite runs keep function-scoped isolation.
        run: |
          python -m pytest -p no:cacheprovider -q \
            -o asyncio_default_fixture_loop_scope=session \
            -o asyncio_default_test_loop_scope=session

  sqlite-test-suite:
    name: Existing Test Suite (SQLite track)
    runs-on: ubuntu-latest
    # Non-blocking: this job mirrors the day-to-day SQLite-backed suite for fast
    # feedback, but the repo has known pre-existing failures on this track (tracked
    # separately) that must not block the Postgres-focused signal above.
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: sqlite+aiosqlite:///./ci.db
      SECRET_KEY: ci-sqlite-track-signkey-donotuse-1a2b3c4d5e6f7a8b9c0d1e2f
      ENCRYPTION_KEY: ci-sqlite-track-encryption-key-do-not-use-in-prod-6f5e4d3c2b1a
      S3_SECRET_KEY: ci-sqlite-track-s3key-donotuse-2b1a6f5e4d3c9c0d1e2f7a8b
      POSTGRES_PASSWORD: ci-sqlite-track-postgres-placeholder-3c4d5e6f1a2b
      ADMIN_EMAIL: ci@blackbox-bom.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run pytest (SQLite) - known pre-existing failures allowed, non-blocking
        run: |
          # The SQLite suite has ~93 documented pre-existing failures (see
          # TEST_FAILURES_TRIAGE.md). They are tracked separately and must not
          # turn this informational check red. Run the suite, surface the result
          # as a warning annotation, but always exit 0 — the gating signal is the
          # Postgres fresh-install job above.
          python -m pytest -p no:cacheprovider -q --tb=no || true
          echo "::warning::SQLite suite ran with known pre-existing failures (see TEST_FAILURES_TRIAGE.md). Non-blocking; Postgres fresh-install is the gating job."

  e2e-playwright:
    name: E2E (Playwright vs real backend)
    runs-on: ubuntu-latest
    # Improvement #7. The pre-existing smoke suite could not catch real bugs:
    # it faked auth via localStorage and ran against `vite preview`, which has
    # no route to the API — a frontend talking to nothing. This job stands up
    # the REAL stack (Postgres -> init_db -> seed fixture -> uvicorn -> built
    # SPA) and drives it through a browser, so login, the proxy, CSRF on
    # writes, and every screen actually mounting are all exercised.
    #
    # NOT a hard gate yet: it is new, and browser suites need a few runs to
    # prove they are not flaky. Promote it (remove continue-on-error) once it
    # has been stable for a while.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bom_user
          POSTGRES_PASSWORD: ci_postgres_pw_9f3a7c1e
          POSTGRES_DB: bom_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_SERVER: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: bom_user
      POSTGRES_PASSWORD: ci_postgres_pw_9f3a7c1e
      POSTGRES_DB: bom_db
      DATABASE_URL: postgresql+asyncpg://bom_user:ci_postgres_pw_9f3a7c1e@127.0.0.1:5432/bom_db
      # NB: must avoid _WEAK_SECRET_VALUES substrings ("test", "secret", ...)
      # or Settings rejects the key and the app refuses to boot.
      SECRET_KEY: ci-e2e-suite-signkey-donotuse-9f3a7c1e4b2d5a8b6d4f2a0c8e7b
      ENCRYPTION_KEY: ci-e2e-suite-encryption-key-do-not-use-in-prod-4b2d9f3a5a8b
      S3_SECRET_KEY: ci-e2e-suite-s3key-donotuse-7c1e4b2d9f3a5a8b6d4f2a0c8e7b
      ADMIN_EMAIL: ci@blackbox-bom.com
      E2E_EMAIL: admin@blackbox.com
      E2E_PASSWORD: admin123
      VITE_API_TARGET: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U bom_user && break
            sleep 2
          done

      - name: Bootstrap schema and seed the E2E fixture
        working-directory: backend
        # --with-user mints the login the suite signs in as; CI has no seeded
        # account (init_db provisions schema, not users).
        run: |
          python -m scripts.init_db
          python -m scripts.seed_e2e_fixture --with-user

      - name: Start the backend
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/health >/dev/null && echo "backend up" && exit 0
            sleep 2
          done
          echo "::error::backend did not start"; cat uvicorn.log; exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: frontend
        # playwright.config.js's webServer builds and previews the SPA; the
        # preview proxy forwards /api to VITE_API_TARGET above.
        run: npx playwright test --reporter=line

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Backend log on failure
        if: failure()
        working-directory: backend
        run: tail -100 uvicorn.log || true
