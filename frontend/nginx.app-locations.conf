# Shared location blocks for both the HTTP and the TLS server.
#
# Included from nginx.conf (plain :80) and nginx.tls.conf (:443). Kept in one
# file on purpose: when these lived in two server blocks they drifted, and a
# route fixed for HTTP stayed broken over HTTPS.

root /usr/share/nginx/html;
index index.html;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 256;

# Uploads and CAD/STEP files are large; the default 1m rejects them with a 413
# that looks like a frontend bug.
client_max_body_size 64m;

location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "public, max-age=3600";
}

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The backend reads this to know the request reached the edge over TLS.
    proxy_set_header X-Forwarded-Proto $scheme;
    # A BOM import or a rollup over a large assembly can outlast the 60s
    # default, which surfaces as a 504 mid-save.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location /ws/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Without this nginx closes an idle websocket at 60s and the client
    # reconnect-loops.
    proxy_read_timeout 3600s;
}
