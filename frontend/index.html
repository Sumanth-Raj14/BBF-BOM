<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Blackbox BOM — Enterprise Bill of Materials Management</title>
  <meta name="description" content="Enterprise BOM scanner, editor, and management system with mobile barcode scanning, CAD viewer, cloud sync, and manufacturing integration."/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <meta property="og:title" content="Blackbox BOM — Enterprise Bill of Materials Management"/>
  <meta property="og:description" content="Enterprise BOM scanner, editor, and management system with mobile barcode scanning, CAD viewer, cloud sync, and manufacturing integration."/>
  <meta property="og:type" content="website"/>
  <meta property="og:image" content="icons/icon-512.svg"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="Blackbox BOM"/>
  <meta name="twitter:description" content="Enterprise BOM scanner, editor, and management system."/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#e85d1f"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <link rel="icon" href="icons/icon.svg" sizes="any" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="icons/icon-192.svg"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="root">
    <div id="app-loading" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#FFFFFF;color:#5D5D5D;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;">
      <div style="text-align:center;">
        <img src="/bbf-logo.svg" alt="Blackbox Factories" width="280" style="width:280px;max-width:74vw;height:auto;margin:0 auto 16px;display:block;"/>
        <div style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:700;font-size:11px;letter-spacing:0.22em;color:#B5BC38;text-transform:uppercase;">Bill of Materials</div>
        <div style="margin-top:22px;display:flex;gap:8px;align-items:center;justify-content:center;">
          <span style="width:5px;height:5px;background:#B5BC38;border-radius:50%;animation:bl 0.8s ease-in-out infinite;"></span>
          <span style="width:5px;height:5px;background:#B5BC38;border-radius:50%;animation:bl 0.8s ease-in-out infinite 0.2s;"></span>
          <span style="width:5px;height:5px;background:#B5BC38;border-radius:50%;animation:bl 0.8s ease-in-out infinite 0.4s;"></span>
        </div>
        <div id="load-status" style="margin-top:16px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;color:#888888;letter-spacing:0.05em;"></div>
      </div>
    </div>
    <style>@keyframes bl{0%,100%{opacity:0.3}50%{opacity:1}}</style>
  </div>

  <script>
    // Error display for development
    window.addEventListener('error', function(e) {
      var el = document.getElementById('load-status');
      if (el) el.innerHTML += '<div style="color:red;margin:4px 0">ERROR: ' + (e.message || e.filename || 'unknown') + ' (line ' + (e.lineno || '?') + ')</div>';
    });
    window.addEventListener('unhandledrejection', function(e) {
      var el = document.getElementById('load-status');
      if (el) el.innerHTML += '<div style="color:orange;margin:4px 0">PROMISE REJECTION: ' + (e.reason?.message || 'unknown') + '</div>';
    });
  </script>

  <!-- Vite entry point (ESM, JSX transformed automatically) -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
