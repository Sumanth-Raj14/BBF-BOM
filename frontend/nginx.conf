# Plain HTTP. This is the DEFAULT and is correct for a local-first install
# reached over localhost or a trusted LAN, and for running behind a reverse
# proxy that already terminates TLS.
#
# Do NOT run this with ENVIRONMENT=production. In production mode the backend
# marks its auth cookies Secure (app/core/auth_cookie.py), browsers refuse to
# send a Secure cookie over http://, and the result is a login that returns 200
# followed by 401 on every request — a total outage that looks like a bug in the
# app. Use nginx.tls.conf (docker-compose.tls.yml) for that, or terminate TLS
# upstream and keep this file.
server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/app-locations.conf;
}
