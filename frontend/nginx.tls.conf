# HTTPS. Required for ENVIRONMENT=production, because the backend sets Secure
# on its auth cookies there and a browser will not send those over plain HTTP.
#
# Expects a certificate and key mounted at /etc/nginx/certs/. See
# docker-compose.tls.yml and scripts/generate-self-signed-cert.sh.

# Redirect http -> https, except the ACME challenge path so an external certbot
# can still renew without taking the site down.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 1.2 floor: 1.0/1.1 are deprecated and fail most corporate scans.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS. Deliberately WITHOUT includeSubDomains and preload: this ships to
    # on-prem installs on internal hostnames, where either could strand sibling
    # services that legitimately have no TLS. Add them once you own the domain.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/snippets/app-locations.conf;
}
